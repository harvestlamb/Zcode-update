<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>技能索引 · ZCode 社区 Skills</title>
  <meta name="description" content="按关键字检索已上架的 ZCode Skill：名称、描述、作者、目录名。" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/skills/skills.css?v=6" />
</head>
<body class="page-catalog">
  <header class="site-header" id="site-header">
    <nav class="nav-bar" aria-label="主导航">
      <a class="brand" href="/">
        <span class="mark" aria-hidden="true">Z</span>
        <span class="word">ZCODE</span>
      </a>
      <div class="nav-links">
        <a href="/docs/">文档</a>
        <a href="/changelog/">更新日志</a>
        <a href="/skills/" class="is-active" aria-current="page">社区</a>
        <button type="button" class="nav-cta js-open-submit">投稿技能</button>
      </div>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-label="打开菜单" aria-expanded="false" aria-controls="mobile-nav">
        <span></span><span></span>
      </button>
    </nav>
    <div class="mobile-nav" id="mobile-nav" hidden>
      <a href="/docs/">文档</a>
      <a href="/changelog/">更新日志</a>
      <a href="/skills/" aria-current="page">社区</a>
      <button type="button" class="js-open-submit">投稿技能</button>
      <a href="/admin/">登录</a>
    </div>
  </header>

  <main>
    <section class="catalog-hero" aria-labelledby="catalog-title">
      <div class="catalog-hero-copy">
        <p class="catalog-kicker">ZCODE · COMMUNITY</p>
        <h1 id="catalog-title">技能索引</h1>
        <p class="catalog-lead">检索全部已上架 Skill。支持多关键字（空格分隔，同时匹配名称、目录、中英文描述与作者）。</p>
      </div>
      <form class="catalog-search" id="catalog-form" role="search">
        <label class="catalog-search-field">
          <span class="sr-only">关键字</span>
          <input id="q" name="q" type="search" placeholder="例如：review 发布 作者名…" autocomplete="off" autofocus />
        </label>
        <div class="catalog-controls">
          <label class="catalog-select">
            <span class="sr-only">排序</span>
            <select id="sort" aria-label="排序方式">
              <option value="updated">最近更新</option>
              <option value="name">名称 A–Z</option>
              <option value="author">作者</option>
            </select>
          </label>
          <label class="catalog-check">
            <input type="checkbox" id="extra-only" />
            <span>仅含附件</span>
          </label>
          <button type="button" id="clear" class="btn btn-ghost btn-sm">清空</button>
          <button type="button" id="refresh" class="btn btn-ghost btn-sm">刷新</button>
        </div>
      </form>
      <div class="catalog-stats" aria-live="polite">
        <span id="count" class="muted"></span>
        <div id="letter-bar" class="letter-bar" hidden></div>
      </div>
    </section>

    <section class="library catalog-library" aria-label="检索结果">
      <div id="list" class="catalog-results"></div>
      <p id="empty" class="empty muted" hidden></p>
      <p id="err" class="err" hidden></p>
    </section>
  </main>

  <footer class="site-foot">
    <a href="/skills/">返回社区首页</a>
    <button type="button" class="foot-btn js-open-submit">投稿技能</button>
    <a href="/admin/">管理后台</a>
    <a href="/docs/skill/">Skill 文档</a>
  </footer>

  <div id="submit-modal" class="submit-modal" hidden>
    <div class="submit-modal-backdrop js-close-submit" tabindex="-1"></div>
    <div class="submit-modal-panel" role="dialog" aria-modal="true" aria-labelledby="submit-modal-title">
      <div class="submit-modal-head">
        <h2 id="submit-modal-title">投稿技能</h2>
        <button type="button" class="submit-modal-close js-close-submit" aria-label="关闭">×</button>
      </div>
      <p class="muted submit-modal-lead">上传含 <code>SKILL.md</code> 的 zip，管理员审核通过后上架。无需填写个人信息。</p>
      <form id="submit-form">
        <div id="submit-dropzone" class="submit-dropzone" tabindex="0" role="button" aria-label="选择技能 zip">
          <input id="submit-file" type="file" accept=".zip,application/zip" hidden />
          <p class="dz-title" id="submit-file-label">点击或拖拽 .zip 到这里</p>
          <p class="muted">需包含 <code>SKILL.md</code>，压缩包不超过 8MB</p>
        </div>
        <div class="submit-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">提交审核</button>
          <button type="button" class="btn btn-ghost js-close-submit">取消</button>
        </div>
        <p id="submit-msg" class="status-line muted" role="status"></p>
      </form>
    </div>
  </div>

  <script src="/skills/skills-common.js?v=6"></script>
  <script src="/skills/catalog.js?v=6"></script>
</body>
</html>

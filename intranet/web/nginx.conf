# nginx for the ZCode mirror: serves the static site + proxies /api to the AI
# container + serves bundled Windows releases under /releases.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    # The mirror files are immutable per build; cache aggressively.
    server_tokens off;
    # allow large uploads/comfortable bodies for /api
    client_max_body_size 8m;

    server {
        listen 80;
        server_name _;
        # Document root: the mirrored site/ extracted by import.sh.
        root /data/site;
        index index.html;
        # Keep redirects port-aware: nginx otherwise rewrites "return 301 /cn/"
        # to an absolute URL on the default port (dropping :8080).
        absolute_redirect off;
        port_in_redirect off;

        # --- AI backend proxy ---
        # The chat widget POSTs here; nginx forwards to the FastAPI container.
        # Also carries the admin API (/api/admin/*), incl. .zdoc uploads.
        location /api/ {
            proxy_pass http://ai:8000;
            # $http_host keeps the client port (8090); $host strips it and breaks
            # absolute redirects / cookie Domain handling behind non-80 publishes.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            client_max_body_size 400m;  # accommodate .zdoc uploads via admin UI
        }

        # --- Windows installers (bundled in the .zdoc) ---
        # Packages live at /data/releases/<version>/... (a top-level dir in the
        # shared volume, sibling of site/). Download buttons point to /releases/...
        location /releases/ {
            alias /data/releases/;
            autoindex on;
            # .exe can be large; let nginx stream them.
            tcp_nopush on;
        }

        # --- Admin UI ---
        # /admin is served by the ai container (FastAPI StaticFiles); the admin
        # REST endpoints already ride on the /api/ proxy above (/api/admin/*).
        # Exact /admin → relative /admin/ so the browser keeps :8090 (Starlette's
        # absolute redirect would drop the port when Host lacked it).
        # ^~ beats the static .js/.css regex so /admin/admin.js is proxied, not 404.
        location = /admin {
            return 301 /admin/;
        }
        location ^~ /admin/ {
            proxy_pass http://ai:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            client_max_body_size 400m;  # .zdoc packages can be a few hundred MB
        }

        # --- Public skill library UI ---
        # Static page + same-origin /api/skills* (API already under /api/).
        location = /skills {
            return 301 /skills/;
        }
        location ^~ /skills/ {
            proxy_pass http://ai:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            client_max_body_size 16m;
        }

        # --- static mirror ---
        # Cache CSS/JS/fonts aggressively; HTML is always revalidated.
        location ~* \.(?:css|js|woff2?|ttf|png|jpe?g|gif|svg|ico|webp)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # The homepage lives at the site root (index.html); the cn/ locale
        # prefix was flattened away by the collector. Serve it directly so the
        # URL bar stays clean (no /cn redirect).
        location = / {
            try_files /index.html =404;
        }

        # SPA-style fallback: missing paths -> homepage (rare for a static mirror,
        # but keeps any rewritten link that missed an index.html from 404-ing ugly).
        location / {
            # index off: never attempt a directory listing; fall through to the
            # homepage on any unmatched path.
            try_files $uri $uri/index.html /index.html;
        }
    }
}
